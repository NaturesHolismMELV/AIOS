# nixpacks.toml - AIOS / MELVcore Railway Deployment
# WeasyPrint system libraries. Uses venv pip explicitly.

[phases.setup]
nixPkgs = [
    "pango",
    "cairo",
    "gdk-pixbuf",
    "libffi",
    "fontconfig",
    "freetype",
    "harfbuzz",
    "fribidi",
    "glib",
]

[phases.install]
cmds = [
    "/opt/venv/bin/pip install -r requirements.txt",
]
