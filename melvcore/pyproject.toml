[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "melvcore"
version = "3.1.1"
description     = "Thermodynamic cooperation kernel — MELVcore v1.0.0"
readme          = "README.md"
license         = { text = "Apache-2.0" }
authors         = [{ name = "L.W. Evans", email = "laurence@naturesholismmelv.com" }]
keywords        = [
    "multi-agent systems", "cooperation", "thermodynamics",
    "MELV", "MELVcore", "AI governance", "agentic"
]
classifiers     = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies    = [
    "fastapi>=0.100",
    "pydantic>=2.0",
    "anthropic>=0.25",
    "httpx>=0.24",
]

[project.optional-dependencies]
server  = ["uvicorn[standard]>=0.22"]
dev     = ["pytest>=7.0", "pytest-asyncio>=0.21", "httpx>=0.24"]

[project.urls]
Homepage      = "https://github.com/NaturesHolismMELV/AIOS"
Repository    = "https://github.com/NaturesHolismMELV/AIOS"
Documentation = "https://github.com/NaturesHolismMELV/AIOS/blob/main/README.md"
"Bug Tracker" = "https://github.com/NaturesHolismMELV/AIOS/issues"
"Zenodo DOI"  = "https://doi.org/10.5281/zenodo.17680563"
ORCID         = "https://orcid.org/0009-0001-0963-1840"

[tool.setuptools.packages.find]
where = [".."]
include = ["melvcore*", "core*", "governance*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
